{% extends "book/base.html" %}
{% block title %}Create account — BookVault{% endblock %}
{% block content %}
<section class="grid min-h-[calc(100vh-8rem)] place-items-center px-4 py-10">
    <div class="w-full max-w-xl">
        <div class="text-center"><div class="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-white text-zinc-950">✦</div><h1 class="mt-5 text-3xl font-black">Create your account</h1><p class="mt-2 text-sm text-zinc-500">Start building a library that feels like yours.</p></div>
        {% if message %}<div class="mt-6 rounded-xl border border-red-500/20 bg-red-500/10 p-3 text-sm text-red-300">{{ message }}</div>{% endif %}
        <form method="post" class="mt-7 rounded-3xl border border-white/10 bg-white/[.03] p-6 sm:p-8">
            {% csrf_token %}
            <div class="grid gap-5 sm:grid-cols-2">
                <div><label class="mb-2 block text-xs font-bold text-zinc-400">First name</label><input name="firstname" required class="w-full rounded-xl border border-white/10 bg-black/20 px-4 py-3 text-sm text-white outline-none focus:border-accent-500"></div>
                <div><label class="mb-2 block text-xs font-bold text-zinc-400">Last name</label><input name="lastname" required class="w-full rounded-xl border border-white/10 bg-black/20 px-4 py-3 text-sm text-white outline-none focus:border-accent-500"></div>
                <div class="sm:col-span-2"><label class="mb-2 block text-xs font-bold text-zinc-400">Email</label><input type="email" name="email" required class="w-full rounded-xl border border-white/10 bg-black/20 px-4 py-3 text-sm text-white outline-none focus:border-accent-500"></div>
                <div class="sm:col-span-2"><label class="mb-2 block text-xs font-bold text-zinc-400">Username</label><input name="username" required autocomplete="username" class="w-full rounded-xl border border-white/10 bg-black/20 px-4 py-3 text-sm text-white outline-none focus:border-accent-500"></div>
                <div><label class="mb-2 block text-xs font-bold text-zinc-400">Password</label><input type="password" name="password1" required autocomplete="new-password" class="w-full rounded-xl border border-white/10 bg-black/20 px-4 py-3 text-sm text-white outline-none focus:border-accent-500"></div>
                <div><label class="mb-2 block text-xs font-bold text-zinc-400">Confirm password</label><input type="password" name="password2" required autocomplete="new-password" class="w-full rounded-xl border border-white/10 bg-black/20 px-4 py-3 text-sm text-white outline-none focus:border-accent-500"></div>
            </div>
            <button class="mt-6 w-full rounded-xl bg-white px-4 py-3.5 text-sm font-bold text-zinc-950 hover:bg-zinc-200">Create account</button>
            <p class="mt-5 text-center text-xs text-zinc-600">Already registered? <a href="{% url 'login' %}" class="font-semibold text-accent-300">Sign in</a></p>
        </form>
    </div>
</section>
{% endblock %}
