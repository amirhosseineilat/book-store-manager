{% extends "book/base.html" %}
{% block title %}پیدا نشد | BookVault{% endblock %}

{% block content %}
<div class="flex min-h-[60vh] items-center justify-center">
    <div class="max-w-lg text-center">
        <div class="mx-auto grid h-24 w-24 place-items-center rounded-3xl bg-zinc-950 text-white shadow-2xl animate-float">
            <i data-lucide="book-x" class="h-10 w-10"></i>
        </div>
        <div class="mt-8 text-7xl font-black tracking-tighter text-zinc-200">404</div>
        <h1 class="mt-2 text-2xl font-black">این کتاب در قفسه نیست!</h1>
        <p class="mt-3 text-sm leading-7 text-zinc-500">{{ message|default:"صفحه یا کتابی که دنبالش هستید پیدا نشد." }}</p>
        <a href="{% url 'book-List' %}" class="mt-7 inline-flex items-center gap-2 rounded-xl bg-zinc-950 px-6 py-3.5 text-sm font-bold text-white hover:bg-violet-600">
            <i data-lucide="arrow-right" class="h-4 w-4"></i>
            برگشت به کتابخانه
        </a>
    </div>
</div>
{% endblock %}
