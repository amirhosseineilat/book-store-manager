{% extends "book/base.html" %}
{% block title %}Not found — BookVault{% endblock %}
{% block content %}
<section class="grid min-h-[calc(100vh-8rem)] place-items-center px-4 py-16">
    <div class="max-w-lg text-center">
        <p class="text-8xl font-black tracking-tighter text-white/10">404</p>
        <h1 class="mt-2 text-3xl font-black">This page disappeared.</h1>
        <p class="mt-3 text-sm leading-6 text-zinc-500">{{ message|default:"The book or page you're looking for is not available." }}</p>
        <a href="{% url 'book-List' %}" class="mt-7 inline-flex rounded-xl bg-white px-5 py-3 text-sm font-bold text-zinc-950">Back to library</a>
    </div>
</section>
{% endblock %}
