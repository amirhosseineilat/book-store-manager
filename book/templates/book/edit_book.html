{% extends "book/base.html" %}

{% block extra_head %}
<style>
.field-label{display:block;margin-bottom:.45rem;font-size:.75rem;font-weight:700;color:#a1a1aa}
.field-input{width:100%;border-radius:.8rem;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);padding:.75rem .9rem;font-size:.875rem;color:#fff;outline:none;transition:.2s}
.field-input:focus{border-color:rgba(139,92,246,.6);box-shadow:0 0 0 3px rgba(139,92,246,.1)}
.field-input::placeholder{color:#52525b}
</style>
{% endblock %}

{% block title %}Edit {{ book.title }} — BookVault{% endblock %}
{% block content %}
<section class="mx-auto max-w-3xl px-4 py-10 sm:px-6 lg:px-8">
    <a href="{% url 'book-Detail' book.id %}" class="text-sm text-zinc-500 hover:text-white">← Back to book</a>
    <div class="mt-6 rounded-3xl border border-white/10 bg-white/[.03] p-6 sm:p-9">
        <p class="text-xs font-bold uppercase tracking-[.2em] text-accent-300">Editor</p>
        <h1 class="mt-2 text-3xl font-black">Edit book</h1>
        <form method="post" class="mt-8 space-y-6">
            {% csrf_token %}
            <div class="grid gap-5 sm:grid-cols-2">
                <div class="sm:col-span-2"><label class="field-label">Title</label><input required name="title" value="{{ book.title }}" class="field-input"></div>
                <div><label class="field-label">Author</label><input required name="author" value="{{ book.author }}" class="field-input"></div>
                <div><label class="field-label">ISBN</label><input required name="isbn" value="{{ book.isbn }}" class="field-input"></div>
                <div><label class="field-label">Publisher</label><input required name="publisher" value="{{ book.publisher }}" class="field-input"></div>
                <div><label class="field-label">Publication date</label><input required type="date" name="publish_date" value="{{ book.publish_date|date:'Y-m-d' }}" class="field-input"></div>
                <div><label class="field-label">Price</label><input required type="number" step="0.01" min="0" name="price" value="{{ book.price }}" class="field-input"></div>
                <div><label class="field-label">Pages</label><input required type="number" min="1" name="page" value="{{ book.page }}" class="field-input"></div>
            </div>
            <div>
                <label class="field-label">Genres</label>
                <div class="grid gap-2 sm:grid-cols-2">
                    {% for category in categories %}
                    <label class="flex cursor-pointer items-center gap-3 rounded-xl border border-white/10 bg-black/20 p-3 text-sm text-zinc-300 hover:border-white/20">
                        <input type="checkbox" name="genre" value="{{ category.id }}" {% if category in book.genre.all %}checked{% endif %} class="h-4 w-4 accent-violet-500">{{ category.name }}
                    </label>
                    {% endfor %}
                </div>
            </div>
            <div class="flex flex-col-reverse gap-3 border-t border-white/10 pt-6 sm:flex-row sm:justify-end">
                <a href="{% url 'book-Detail' book.id %}" class="rounded-xl border border-white/10 px-5 py-3 text-center text-sm font-semibold text-zinc-300 hover:bg-white/5">Cancel</a>
                <button class="rounded-xl bg-white px-5 py-3 text-sm font-bold text-zinc-950 hover:bg-zinc-200">Save changes</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
